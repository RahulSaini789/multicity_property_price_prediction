# .github/workflows/ci.yml
# PropML — Full CI/CD Pipeline
#
# Trigger: push to main, pull_request to main
#
# Stages (in order):
#   1. lint        — flake8, black, isort (code quality)
#   2. test        — pytest 15+ tests (correctness)
#   3. model-gate  — read reports/metrics.json, fail if gate fails
#   4. docker      — build + push image to GHCR (main branch only)
#   5. deploy      — trigger Render.com redeploy (main branch only)
#   6. smoke-test  — curl /health on live API (main branch only)
#
# Concurrency: only one run per branch at a time.
# cancel-in-progress: true prevents stale deploys.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Stage 1: Lint ──────────────────────────────────────────────────
  lint:
    name: Lint (flake8 + black + isort)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linting tools
        run: pip install flake8==7.0.0 black==24.1.0 isort==5.13.2

      - name: flake8 (ignore E501 long lines)
        run: flake8 src/ tests/ --max-line-length=120 --ignore=E501,W503 --exclude=__pycache__

      - name: black --check
        run: black --check src/ tests/ --line-length=120

      - name: isort --check
        run: isort --check-only src/ tests/ --profile=black

  # ── Stage 2: Test ──────────────────────────────────────────────────
  test:
    name: pytest (15+ tests)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          pip install pytest==8.0.0 pytest-asyncio==0.23.4 httpx==0.26.0
          pip install pandas==2.2.0 numpy==1.26.4 scikit-learn==1.4.0
          pip install xgboost==2.0.3 lightgbm==4.2.0
          pip install fastapi==0.110.0 "uvicorn[standard]==0.27.1" pydantic==2.6.1
          pip install shap==0.44.1 joblib==1.3.2
          pip install pyarrow==16.0.0 pyyaml==6.0.1

      - name: Run pytest
        run: pytest tests/ -v --tb=short --ignore=tests/test_model_gate.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/test_results.txt
          if-no-files-found: ignore

  # ── Stage 3: Model Gate ────────────────────────────────────────────
  model-gate:
    name: Production Gate Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Run gate check
        run: python src/training/evaluate.py
        # exits 1 if MAPE > 22% or R² < 0.82 → pipeline stops here

  # ── Stage 4: Docker Build + Push ──────────────────────────────────
  docker:
    name: Docker Build + Push
    runs-on: ubuntu-latest
    needs: model-gate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/propml-api:latest
            ghcr.io/${{ github.repository_owner }}/propml-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max   # GitHub Actions cache for Docker layers

  # ── Stage 5: Deploy to Render ──────────────────────────────────────
  deploy:
    name: Deploy to Render.com
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Deploy triggered at $(date)"

      - name: Wait for Render to start
        run: sleep 120  

  # ── Stage 6: Smoke Test ────────────────────────────────────────────
  smoke-test:
    name: Smoke Test (Live API)
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Health check
        run: |
          echo "Testing https://multicity-property-price-prediction-2.onrender.com/health"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://multicity-property-price-prediction-2.onrender.com/health)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Health check FAILED with status $STATUS"
            exit 1
          fi
          echo "Health check PASSED"

      - name: Predict smoke test
        run: |
          # Test 1: Gurgaon
          RESPONSE=$(curl -s -X POST https://multicity-property-price-prediction-2.onrender.com/predict \
            -H "Content-Type: application/json" \
            -d '{"city":"gurgaon","property_type":"flat","area_sqft":1800,"bhk":3,"bathroom":3,"floor_pos":5,"total_floors":15,"amenity_score":3.0,"avg_rating":4.2}')
          echo "Gurgaon response: $RESPONSE"
          if echo "$RESPONSE" | grep -q "prediction_cr"; then
            echo "Gurgaon smoke test PASSED"
          else
            echo "Gurgaon smoke test FAILED"
            exit 1
          fi

          # Test 2: Mumbai (Phase 3 city)
          RESPONSE2=$(curl -s -X POST https://multicity-property-price-prediction-2.onrender.com/predict \
            -H "Content-Type: application/json" \
            -d '{"city":"mumbai","property_type":"flat","area_sqft":950,"bhk":2,"bathroom":2,"floor_pos":8,"total_floors":20,"amenity_score":3.5,"avg_rating":4.2}')
          echo "Mumbai response: $RESPONSE2"
          if echo "$RESPONSE2" | grep -q "prediction_cr"; then
            echo "Mumbai smoke test PASSED"
          else
            echo "Mumbai smoke test FAILED"
            exit 1
          fi