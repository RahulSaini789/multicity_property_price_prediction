# configs/cities.yaml
# MagicBricks scraping config for all PropML cities
#
# price_bounds_cr:  [min, max] in Crores — realistic range for this city
# ppsf_bounds:      [min, max] price per sqft in ₹ — for validation
# area_bounds_sqft: [min, max] sqft — for validation
# tier:             1 (budget), 2 (mid), 3 (premium) — for model feature
# annual_income:    median annual household income ₹ — for EMI affordability
# appreciation_pct: annual price appreciation (NHB Residex based)
# coaching_city:    true if has major coaching institutes (Kota pattern)

# ── Tier 3: Premium metros ────────────────────────────────────────────────────

gurgaon:
  base_url: "https://www.magicbricks.com/property-for-sale/residential-real-estate?cityName=Gurgaon&proptype=Multistorey-Apartment,Builder-Floor-Apartment,Residential-House,Residential-Plot,Floor-Apartment"
  price_bounds_cr:   [0.10, 60.0]
  ppsf_bounds:       [1500, 45000]
  area_bounds_sqft:  [100, 20000]
  tier:              3
  annual_income:     1200000
  appreciation_pct:  0.065
  coaching_city:     false
