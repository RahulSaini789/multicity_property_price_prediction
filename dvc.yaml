stages:

  # ── Stage 1: Scrape ───────────────────────────────────────────────────────
  scrape:
    cmd: python src/ingestion/run_all_cities.py
    deps:
      - src/ingestion/magicbricks_scraper.py
      - src/ingestion/run_all_cities.py
      - configs/cities.yaml
    outs:
      - data/raw/
    params:
      - params.yaml:
        - scraping.max_listings_per_city

  # ── Stage 2: Validate ─────────────────────────────────────────────────────
  # reports/validation/ output forces clean to depend on validate.
  # DAG: scrape → validate → clean
  validate:
    cmd: python src/validation/validate_schema.py --city all
    deps:
      - src/validation/validate_schema.py
      - data/raw/
    outs:
      - reports/validation/

  # ── Stage 3: Clean ────────────────────────────────────────────────────────
  # reports/validation/ dep forces validate → clean ordering in DAG.
  clean:
    cmd: python src/cleaning/cleaning_pipeline.py
    deps:
      - src/cleaning/cleaning_pipeline.py
      - data/raw/
      - reports/validation/
    outs:
      - data/cleaned/combined_cleaned.parquet
    params:
      - params.yaml:
        - cleaning.iqr_multiplier
        - cleaning.min_price_cr
        - cleaning.max_price_cr

  # ── Stage 4: Featurize ────────────────────────────────────────────────────
  # If enrich_osm has been run, data/osm_cache/ exists and distances are used.
  # If not, OSM distance columns default to -1. Pipeline still works either way.
  featurize:
    cmd: python src/features/feature_engineering.py
    deps:
      - src/features/feature_engineering.py
      - data/cleaned/combined_cleaned.parquet
    outs:
      - data/features/
    params:
      - params.yaml:
        - features.kfold_splits
        - features.kfold_smoothing
        - features.amenity_weights
        - features.high_floor_threshold

  # ── Stage 5: Train ────────────────────────────────────────────────────────
  train:
    cmd: python src/training/train.py --trials 100
    deps:
      - src/training/train.py
      - data/features/combined_engineered.parquet
    outs:
      - models/
    metrics:
      - reports/metrics.json:
          cache: false
    params:
      - params.yaml:
        - training.cv_folds
        - training.optuna_trials
        - training.random_state
        - training.tier_weights
        - gate.max_mape_pct
        - gate.min_r2

  # ── OSM Enrichment (manual stage, run once after fresh scrape) ────────────
  # Run separately — NOT called by dvc repro:
  #   dvc repro enrich_osm
  #
  # Takes ~30 mins. Cache persists in data/osm_cache/ so re-runs are fast.
  # After running, call dvc repro featurize train to pick up distances.
  enrich_osm:
    cmd: python src/features/feature_engineering.py --enrich-osm
    deps:
      - src/features/feature_engineering.py
      - data/cleaned/combined_cleaned.parquet
    outs:
      - data/osm_cache/