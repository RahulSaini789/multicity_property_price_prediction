stages:
  scrape:
    cmd: python src/ingestion/run_all_cities.py
    deps:
      - src/ingestion/magicbricks_scraper.py
      - src/ingestion/run_all_cities.py
      - configs/cities.yaml
    outs:
      - data/raw/
    params:
      - params.yaml:
        - scraping.max_listings_per_city
        - scraping.headless
        - scraping.delay_min
        - scraping.delay_max

  validate:
    cmd: python src/validation/validate_schema.py --city all --fail-on-critical
    deps:
      - src/validation/validate_schema.py
      - data/raw/gurgaon/
      - data/raw/noida/
      - data/raw/chandigarh/
      - data/raw/kota/
    outs:
      - reports/validation/
    params:
      - params.yaml:
        - validation.min_rows_required
        - validation.max_null_pct_price
        - validation.max_null_pct_area
        - validation.min_ppsf_valid_pct

  clean:
    cmd: python src/cleaning/cleaning_pipeline.py
    deps:
      - reports/validation/
    outs:
      - data/cleaned/combined_cleaned.parquet
    params:
      - params.yaml:
        - cleaning.min_price_cr
        - cleaning.max_price_cr
        - cleaning.iqr_multiplier
        - cleaning.min_bhk
        - cleaning.max_bhk
  featurize:
    cmd: python src/features/feature_engineering.py
    deps:
      - src/features/feature_engineering.py
      - data/cleaned/combined_cleaned.parquet
    outs:
      - data/features/combined_engineered.parquet
      - data/features/feature_list.txt
      - data/features/feature_metadata.json
      - data/features/target_encoding_map.json
    params:
      - params.yaml:
        - features.kfold_splits
        - features.kfold_smoothing
        - features.amenity_weights
        - features.high_floor_threshold

